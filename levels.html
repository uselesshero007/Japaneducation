<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b7131a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>JLPT Level Path | Japan Education</title>
  <style>
    :root{--canvas:#f8f9ff;--paper:#fff;--ink:#0b1c30;--muted:#545f73;--wash:#eff4ff;--line:#dce9ff;--red:#b7131a;--green:#006947}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans","Noto Sans",sans-serif}main{width:min(760px,100%);margin:auto;padding:24px 16px 40px}.je-level-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.je-level-top a{color:var(--red);font-weight:700;text-decoration:none}.je-level-brand{display:flex;align-items:center;gap:10px}.je-level-brand img{width:36px;height:36px;object-fit:cover;border-radius:10px}.je-level-brand strong{font-size:16px}.je-level-intro{margin:12px 0 18px}.je-level-intro span,.je-level-kicker{color:var(--red);font-size:11px;font-weight:800;letter-spacing:.08em}.je-level-intro h1{margin:4px 0;font-size:28px;line-height:1.2}.je-level-intro p{margin:0;color:var(--muted)}.je-level-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(11,28,48,.05)}.je-level-card.je-level-locked{opacity:.72}.je-level-head{display:flex;justify-content:space-between;gap:12px}.je-level-head h2{margin:2px 0;font-size:20px}.je-level-head p{margin:2px 0;color:var(--muted)}.je-level-head>strong{font-size:20px;color:var(--red);white-space:nowrap}.je-level-bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 6px}.je-level-bar i{display:block;height:100%;background:var(--red);border-radius:inherit}.je-level-status{font-size:12px;color:var(--muted);font-weight:700}.je-level-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.je-level-columns>div{background:var(--wash);padding:10px;border-radius:10px}.je-level-columns b,.je-level-columns span{display:block}.je-level-columns span{color:var(--green);font-weight:700;font-size:12px}.je-level-columns button,.je-quiz-button{width:100%;border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:700;padding:9px 8px;margin-top:8px;cursor:pointer}.je-level-columns button:disabled,.je-quiz-button:disabled{background:#c9d3e4;color:#65758b;cursor:not-allowed}.je-level-example{border-left:3px solid var(--red);padding:8px 10px;background:#fff7f7}.je-level-example strong,.je-level-example span,.je-level-example small{display:block}.je-level-example span,.je-level-example small{color:var(--muted);margin-top:3px}.je-level-detail{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(700px,calc(100% - 24px));background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 10px 30px rgba(11,28,48,.2);z-index:20}.je-level-detail h2{margin:6px 0}.je-level-detail p{color:var(--muted)}.je-detail-close{float:right;border:0;background:var(--wash);color:var(--red);padding:6px 10px;border-radius:8px;font-weight:700}@media(max-width:520px){.je-level-columns{grid-template-columns:1fr}.je-level-intro h1{font-size:25px}}
  </style>
  <style>
    .je-level-open{border:0;border-radius:8px;background:var(--wash);color:var(--red);font-weight:700;padding:8px 10px;cursor:pointer;white-space:nowrap}.je-course-lessons{display:grid;gap:8px;margin-top:14px}.je-course-lessons>strong{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.je-course-lessons button{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:10px;text-align:left;cursor:pointer;touch-action:manipulation}.je-course-lessons button:hover,.je-course-lessons button:focus{border-color:var(--red);outline:2px solid rgba(183,19,26,.12)}.je-course-lessons span{font-weight:700;color:var(--red)}.je-course-lessons small{color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <div class="je-level-top"><div class="je-level-brand"><img src="assets/logo.png" alt="Japan Education logo"><strong>Japan Education</strong></div><a href="index.html">Home</a></div>
    <div id="je-levels-app" aria-live="polite"></div>
  </main>
  <script src="app.js?v=10"></script>
</body>
</html>
